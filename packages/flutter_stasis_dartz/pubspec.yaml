version: 1.0.0
homepage: https://github.com/DIMAAGR/flutter_stasis
repository: https://github.com/DIMAAGR/flutter_stasis/tree/main/packages/flutter_stasis_dartz

topics:
  - state-management
  - dartz
  - either
  - flutter

environment:
  sdk: ^3.10.0

dependencies:
  flutter:
    sdk: flutter
  dartz: ^0.10.1
  flutter_stasis:
  flutter_stasis_core:

dev_dependencies:
  flutter_lints: ^6.0.0
